<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D Parallax</title>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <img src="icons/icon32.png" width="32" height="32" alt="">
    <strong>3D Parallax</strong><span class="popup-version" id="popupVersion"></span>
  </header>
  <main>
    <p class="popup-greeting"><span id="popupGreetingText">Hello, </span><strong id="popupName">there</strong></p>
    <div class="stats-row" aria-label="Your homepage">
      <div class="stat-card"><span class="stat-val" id="statLinks">—</span><span class="stat-lbl">Links</span></div>
      <div class="stat-card"><span class="stat-val" id="statTemplates">—</span><span class="stat-lbl">Themes</span></div>
      <div class="stat-card"><span class="stat-val" id="statDays">—</span><span class="stat-lbl">Days</span></div>
    </div>
    <h2 class="section-label" id="backgroundLabel">Current background</h2>
    <button type="button" class="template-row" id="backgroundBtn" title="Change your background">
      <span class="tmpl-icon" id="tmplIcon" aria-hidden="true"></span>
      <span class="background-copy"><strong id="tmplName">Loading…</strong><span id="tmplDesc"></span><small id="wallpaperCount"></small></span>
      <i class="fas fa-chevron-right" aria-hidden="true"></i>
    </button>
    <h2 class="section-label">Quick links</h2><div class="links-scroll" id="quickLinks"></div>
    <div class="preferences">
      <label class="toggle-row" for="toggleMatrix"><span><i class="fas fa-terminal" aria-hidden="true"></i> Matrix rain</span><input type="checkbox" id="toggleMatrix" role="switch"><span class="toggle-track" aria-hidden="true"></span></label>
      <div class="toggle-row"><span><i class="fas fa-music" aria-hidden="true"></i> Ambient sound</span><button type="button" class="small-button" id="ambientBtn">Choose sound</button></div>
      <div class="toggle-row"><span><i class="fas fa-table-cells" aria-hidden="true"></i> <span id="layoutSummary">Layout</span></span><button type="button" class="small-button" id="layoutBtn">Edit layout</button></div>
    </div>
    <p id="popupStatus" role="status"></p>
  </main>
  <div class="popup-actions">
    <button type="button" class="primary-button" id="openNewTab"><i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i> Open Homepage</button>
    <div class="actions-grid">
      <button type="button" id="popupSettingsBtn"><i class="fas fa-sliders" aria-hidden="true"></i> Settings</button>
      <button type="button" id="exportBtn"><i class="fas fa-download" aria-hidden="true"></i> Export</button>
      <button type="button" id="resetBtn"><i class="fas fa-rotate-left" aria-hidden="true"></i> Reset</button>
    </div>
  </div>
  <footer><a href="https://3dparallax.app" target="_blank" rel="noopener noreferrer">3dparallax.app</a><a href="https://chromewebstore.google.com/detail/3d-parallax/cgodhedchgcogoicfmdpgfopbfkcafkn/reviews" id="popupFeedbackLink" target="_blank" rel="noopener noreferrer"><i class="fas fa-star" aria-hidden="true"></i> Feedback &amp; rating</a></footer>
  <script src="extension-links.js"></script>
  <script src="templates.js"></script>
  <script src="wallpaper.js"></script>
  <script src="popup.js"></script>
</body>
</html>
